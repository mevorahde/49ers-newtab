<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>David's New Tab</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="weather-widget" id="weather-widget">
        <div class="weather-icon" id="weather-icon">☀️</div>
        <div class="weather-temp" id="weather-temp">--°</div>
        <div class="weather-desc" id="weather-desc">--</div>
        <div class="weather-location" id="weather-location">Locating...</div>
      </div>

      <div class="center-section">
        <div class="welcome">WELCOME BACK, DAVID</div>
        <div class="date" id="date"></div>
        <div class="time" id="time"></div>
      </div>

      <div class="countdown-compact">
        <div class="countdown-label">NEXT GAME</div>
        <div class="countdown-value" id="countdown">-- DAYS</div>
        <div class="game-card hidden" id="game-card">
          <img id="game-logo" class="game-logo" src="" alt="Opponent logo">
          <div class="game-card-info">
            <div class="game-week-badge" id="game-week-badge"></div>
            <div class="game-opponent" id="game-opponent"></div>
            <div class="game-meta" id="game-meta"></div>
            <div class="game-date" id="game-date"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="search-container">
      <input id="search-input" type="text" placeholder="Search the web" class="search-box">
    </div>

    <div class="favorites" id="favorites"></div>

    <div id="context-menu" class="context-menu hidden">
      <button id="edit-site-btn" class="context-action">Edit site</button>
      <button id="delete-site-btn" class="context-action">Delete site</button>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="site-modal">
        <div class="modal-title" id="modal-title">Add site</div>
        <label>
          Site name
          <input id="site-name" type="text" placeholder="Name" autocomplete="off">
        </label>
        <label>
          Site URL
          <input id="site-url" type="url" placeholder="https://example.com" autocomplete="off">
        </label>
        <div class="modal-actions">
          <button id="cancel-site-btn" type="button">Cancel</button>
          <button id="save-site-btn" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden">
      <span id="toast-message"></span>
      <button id="undo-btn" class="toast-action">Undo</button>
      <button id="toast-close" class="toast-close">✕</button>
    </div>

    <div class="todo">
      <div class="todo-title">TO‑DO LIST</div>
      <div class="todo-hint">Click a task to complete it. Use ✎ to edit and ✖ to remove.</div>

      <div class="todo-input-row">
        <input id="todo-input" type="text" placeholder="Add a new task...">
        <button id="add-btn">Add</button>
      </div>

      <div class="todo-box">
        <ul id="todo-list"></ul>
      </div>
    </div>

  </div>

</body>
</html>
